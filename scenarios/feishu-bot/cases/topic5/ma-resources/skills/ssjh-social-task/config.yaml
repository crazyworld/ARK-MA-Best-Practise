# ================================================================
# ssjh-social-task — 任务配置
# 分析师每次取数时修改此文件
# ================================================================

# ──────────────────────────────────────────
# 任务基本信息
# ──────────────────────────────────────────
task:
  # 业务请求ID：Agent为一次真实取数请求分配并保存；恢复/换目录必须复用，不能重生成。
  request_id: ""
  # 旧name仅保留配置兼容；远端名由request_id确定生成，供对账定位。
  name: ""
  # 通知邮箱（覆盖 api_config.yaml 中的默认值；留空则用默认）
  email: ""

# ──────────────────────────────────────────
# 数据采集条件
# ──────────────────────────────────────────
search:
  # 历史完整日期 YYYY-MM-DD；结束日须早于今天，最长12个日历月。
  start_date: "2026-10-28"
  end_date: "2026-10-28"

  # 采集模式: 0=快速取数（存量） 1=在线采集（实时入库后取）
  # 在线模式保留任务条件，但声量仅为不确定估算，创建前须有接受依据。
  is_fast: 0

  # 情感筛选（逗号分隔）: 0=中性 1=正面 -1=负面
  sentiments: "0,1,-1"

  # 关键词匹配字段（逗号分隔）
  # 常用: content,title
  # 扩展: audio_asr_content, cover_ocr_content, video_highlight_content, video_content
  keyword_fields: "content,title"

  # 统一作用于本次全部已选平台；未指定键时使用以下默认值。
  # all=不限广告（保留未知值）；exclude=仅非广告；only=仅广告。
  # 互动量为非负整数，边界包含；null=该端不限。
  # 两端null不发送互动筛选，保留互动缺失内容；显式0也属于筛选，会排除互动空值。
  filters:
    ad: all
    interaction_min: null
    interaction_max: null

  # 平台来源（逗号分隔，支持多选）
  # 可选值: weibo, weixin, forum, news, video, qa, xiaohongshu, shortVideo
  # video/qa/shortVideo必须选择下列已接入站点，不能使用数据超市appId/scopeId。
  source: "weibo"

  # ── 微博 ────────────────────────────────
  weibo:
    # 采集类型: 0=主+回帖 1=主帖 2=回帖
    msg_type: 0

  # ── 微信公众号：文章，不提供评论开关 ─────────
  weixin:
    msg_type: 1

  # ── 短视频（抖音/快手/视频号）──────────────
  short_video:
    # 站点ID（逗号分隔）: 抖音=1003583 快手=1334510 视频号=25047925
    site: "1003583,1334510,25047925"
    # 采集类型: 0=主+评论 1=主帖 2=评论
    msg_type: 0

  # ── 小红书 ─────────────────────────────
  xiaohongshu:
    # 采集类型: 0=笔记+评论 1=笔记 2=评论
    msg_type: 0

  # ── 论坛 ───────────────────────────────
  forum:
    # 站点ID（可为空，不填=全部论坛）
    site: ""
    # 采集类型: 0=主+回帖 1=主帖 2=回帖
    msg_type: 0

  # ── 新闻 ───────────────────────────────
  news:
    # 站点ID（可为空）
    site: ""
    # 采集类型: 0=主+评论 1=主帖 2=评论
    msg_type: 1

  # ── 视频（B站/爱奇艺/腾讯视频）────────
  video:
    # 站点ID: B站=44 爱奇艺=47 腾讯视频=35；搜狐视频尚未接通。
    site: "44"
    # 采集类型: 0=主+评论 1=主帖 2=评论
    msg_type: 1

  # ── 问答（知乎/百度知道）───────────────────
  qa:
    # 站点ID: 知乎=101944 百度知道=102026
    site: "101944"
    # 采集类型: 0=问题+回答 1=问题 2=回答
    msg_type: 0

# ──────────────────────────────────────────
# 分析对象（支持关键词采集 或 账号采集）
# 关键词语法: + 表示AND，| 表示OR，支持括号
#   示例: "(瑞幸|星巴克)+(美式|拿铁)"
# ──────────────────────────────────────────
profiler:
  # 分析对象名称（必填）
  name: "示例关键词"

  # ── 关键词采集 ──────────────────────────
  keywords: "示例关键词"
  filterwords: ""   # 过滤词（可为空）

  # ── 账号采集（可选，与关键词可同时使用）──────
  weibo_uid: ""         # 微博 UID
  biz: ""               # 微信公众号 biz
  xhs_acc_id: ""        # 小红书账号 ID
  bili_acc_id: ""       # B 站账号 ID
  sv_acc_id: ""         # 抖音账号 ID
  kuaishou_uid: ""      # 快手账号（需选择快手）
  shipinhao_uid: ""     # 视频号账号（需选择视频号）
  zhihu_uid: ""        # 知乎账号（需选择知乎）

# 估算策略与任务条件分离。引用必须来自本次实际决策，不可填示例冒充确认。
precheck:
  uncertainty_acceptance_ref: ""
  # 统计不可用时可添加manual_estimate: {counts: {weibo: 120}, reference: 实际估算依据}
  # manual_estimate是上游估计，不是供应商统计；示例数量不是默认值。

# ──────────────────────────────────────────
# 输出配置
# ──────────────────────────────────────────
output:
  # 输出文件路径（支持 .xlsx 或 .csv）
  file: "output/result.xlsx"

  # 使用字段模板文件（相对路径，基于本配置文件目录）
  # 设为 "" 则输出原始全量字段（不做筛选/排序）
  template: "template.yaml"

  # v0.9.1不读取checkpoint_mode；确认必须在create之前记录。

risk:
  # 统计结果允许用于创建的最长间隔；默认30分钟，最大1天。
  precheck_max_age_seconds: 1800
  # 声量预估与任务结果允许正常波动；不影响任务量/下载量严格一致校验。
  # 正常：绝对差<=20 或 相对差<=5%；重大：绝对差>100 且 相对差>20%。
  volume_deviation:
    normal_absolute: 20
    normal_ratio: 0.05
    major_absolute: 100
    major_ratio: 0.20

# 工作流中间产物默认只交上游；日志始终记录，不自动发送消息。
observability:
  delivery_mode: intermediate  # intermediate / user
  sample_kind: normal          # normal / diagnostic / test；开始记录后不能更改
